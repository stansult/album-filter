name: Bug report
description: Report reproducible incorrect behavior in Album Filter or its project tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please use a minimal example and do not include private Facebook album names, photos, account details, or credentials.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issue check
      options:
        - label: I searched the existing issues and did not find the same problem.
          required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Where did the problem occur?
      options:
        - Facebook album page
        - Album Filter Playground
        - Chrome Web Store packaging or release tooling
        - Automated tests or CI
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Album Filter version or commit
      description: For an installed extension, find the version at chrome://extensions. For development work, provide the commit SHA if known.
      placeholder: "For example: 0.1.5 or 5f61930"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Chrome Web Store
        - Unpacked extension from this repository
        - Not applicable
        - Other or unknown
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "For example: Chrome 140.0.7339.80"
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "For example: macOS 15.6, Windows 11, or Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: page-context
    attributes:
      label: Page context
      description: Describe the page type without sharing a private profile, album, or account URL.
      placeholder: "For example: facebook.com/<user>/photos_albums or the local playground"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from loading the page or extension and provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include visible messages or symptoms.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized screenshots, recordings, console output, Playwright traces, or related issue links when useful.
      placeholder: Drag files here or paste sanitized text and links.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private album names, photos, account information, credentials, and other personal data from this report and its attachments.
          required: true

